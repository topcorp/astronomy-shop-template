# Scans the shop's 2.1.3 images, which the lab runs unchanged, and this
# repository's files. HIGH and CRITICAL findings that have a fix go to code
# scanning, one category per image, so each image's alerts open and close on
# their own.
name: Trivy

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # By digest, because tags can be moved (GHSA-69fq-xp46-6x23). Trivy 0.76.1;
  # the same digest on GHCR and Docker Hub.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  TRIVY_ARGS: --severity HIGH,CRITICAL --ignore-unfixed --format sarif

jobs:
  image:
    name: image ${{ matrix.service }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service:
          - accounting
          - ad
          - cart
          - checkout
          - currency
          - email
          - flagd-ui
          - fraud-detection
          - frontend
          - frontend-proxy
          - image-provider
          - kafka
          - load-generator
          - payment
          - postgresql
          - product-catalog
          - quote
          - recommendation
          - shipping
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan ghcr.io/open-telemetry/demo:2.1.3-${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/out" "$TRIVY_IMAGE" image $TRIVY_ARGS \
            --output /out/trivy.sarif "ghcr.io/open-telemetry/demo:2.1.3-$SERVICE"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image-${{ matrix.service }}

  repository:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the repository's files
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo "$TRIVY_IMAGE" fs --scanners vuln $TRIVY_ARGS \
            --output trivy.sarif .
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-repository
